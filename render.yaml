services:
  - type: web
    name: scorestream-render
    runtime: docker
    rootDir: scorestream-render
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MIN_SHOT_INTERVAL_MS
        value: "60000"
      - key: PAGE_IDLE_TTL_MS
        value: "300000"
